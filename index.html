<style>
:root{--bg:#f5f7f5;--white:#fff;--ink:#1e2a24;--muted:#758078;--line:#e8ece8;--green:#176b4a;--mint:#e4f4ea;--mint2:#b8e6ca;--red:#c75454;--amber:#bf8429;--nav:#13291f;--shadow:0 12px 35px #1834260b}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:'DM Sans',sans-serif;color:var(--ink)}button,input,select,textarea{font:inherit}button{cursor:pointer}.layout{min-height:100vh;display:grid;grid-template-columns:250px 1fr}.side{position:sticky;top:0;height:100vh;padding:24px 16px;background:#fff;border-right:1px solid var(--line);display:flex;flex-direction:column;z-index:5}.logo{display:flex;align-items:center;gap:11px;padding:0 10px 28px}.logo-icon{width:38px;height:38px;border-radius:13px;background:var(--green);color:#fff;display:grid;place-items:center;font-size:19px}.logo strong{font:800 17px Manrope;letter-spacing:-.6px}.logo small{display:block;font-size:10px;color:var(--muted);margin-top:2px}.nav-label{padding:10px 12px 7px;font-size:9px;letter-spacing:1.1px;color:#99a29b;font-weight:700;text-transform:uppercase}.nav{display:grid;gap:4px}.nav button{width:100%;border:0;background:transparent;text-align:left;padding:11px 12px;border-radius:11px;color:#66736a;font-size:12px;font-weight:600;display:flex;gap:11px;align-items:center;transition:.15s}.nav button i{width:17px;text-align:center;font-size:14px}.nav button:hover{background:#f5f8f5;color:var(--green)}.nav button.active{background:var(--mint);color:var(--green)}.side-bottom{margin-top:auto}.local-note{background:#f5f8f5;border-radius:12px;padding:11px;color:#748077;font-size:10px;line-height:1.5}.local-note i{color:var(--green);margin-right:5px}.content{min-width:0;padding:26px 32px 50px;max-width:1500px;width:100%;margin:auto}.top{display:flex;align-items:center;justify-content:space-between;gap:15px;margin-bottom:25px}.heading h1{font:800 25px Manrope;margin:0;letter-spacing:-.8px}.heading p{margin:5px 0 0;color:var(--muted);font-size:12px}.top-actions{display:flex;gap:8px}.btn{border:1px solid var(--line);background:#fff;color:#3f4c43;padding:9px 12px;border-radius:10px;font-size:11px;font-weight:700;display:inline-flex;align-items:center;gap:7px;justify-content:center;transition:.15s}.btn:hover{border-color:#bad9c3;transform:translateY(-1px)}.btn-primary{background:var(--green);color:#fff;border-color:var(--green)}.btn-primary:hover{background:#105b3d;color:#fff}.btn-danger{color:var(--red)}.btn-small{padding:7px 9px;font-size:10px}.month-control{border:1px solid var(--line);background:white;padding:8px 10px;border-radius:10px;font-size:11px;color:#536057}.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:13px;margin-bottom:16px}.card{border:1px solid var(--line);background:white;border-radius:16px;padding:16px;box-shadow:var(--shadow);min-width:0}.stat-head{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:10px;font-weight:600}.stat-icon{width:30px;height:30px;border-radius:10px;background:#f0f6f1;color:var(--green);display:grid;place-items:center}.stat-value{font:800 21px Manrope;letter-spacing:-.6px;margin:13px 0 5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.stat-foot{font-size:10px;color:#89938b}.positive{color:var(--green)}.negative{color:var(--red)}.grid2{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(260px,.9fr);gap:15px}.card-title{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px}.card-title h2{font:700 13px Manrope;margin:0}.card-title p{color:var(--muted);font-size:10px;margin:4px 0 0}.chart{height:190px;position:relative}.chart canvas{width:100%;height:100%}.legend{display:flex;gap:14px;color:var(--muted);font-size:9px}.legend span{display:flex;align-items:center;gap:5px}.legend i{width:7px;height:7px;border-radius:50%;background:var(--green)}.legend .out{background:#e08b82}.recent{margin-top:15px}.section-head{display:flex;justify-content:space-between;align-items:center;margin:4px 0 11px}.section-head h2{font:700 14px Manrope;margin:0}.muted{font-size:10px;color:var(--muted)}.table-wrap{overflow-x:auto}.table{width:100%;border-collapse:collapse;min-width:540px}.table th{text-align:left;color:#8b958d;font-size:9px;text-transform:uppercase;letter-spacing:.7px;padding:9px 10px;border-bottom:1px solid var(--line)}.table td{padding:11px 10px;border-bottom:1px solid #f0f2f0;font-size:11px}.table tr:last-child td{border-bottom:0}.tx-title{font-weight:700}.tx-sub{font-size:9px;color:var(--muted);margin-top:3px}.amount{font-weight:700;white-space:nowrap}.pill{padding:4px 7px;border-radius:20px;background:#f0f3f0;font-size:9px;color:#657067;display:inline-block}.empty{text-align:center;color:#8a958c;padding:28px 10px;font-size:11px}.empty i{display:block;font-size:22px;color:#b8c6bb;margin-bottom:8px}.category-list{display:grid;gap:13px}.cat-line{display:grid;grid-template-columns:1fr auto;gap:7px}.cat-title{display:flex;justify-content:space-between;align-items:center;font-size:10px}.progress{height:6px;border-radius:10px;background:#edf1ed;overflow:hidden;grid-column:1/-1}.progress span{display:block;height:100%;background:#73bd8a;border-radius:10px}.progress span.over{background:#db7970}.cat-amount{font-size:9px;color:var(--muted)}.page-tools{display:flex;justify-content:space-between;gap:10px;margin:0 0 14px;flex-wrap:wrap}.filters{display:flex;gap:7px;flex-wrap:wrap}.filters input,.filters select,.field input,.field select,.field textarea{border:1px solid var(--line);background:#fff;padding:9px 10px;border-radius:9px;color:var(--ink);font-size:11px;outline:none}.filters input:focus,.field input:focus,.field select:focus,.field textarea:focus{border-color:#83bd96;box-shadow:0 0 0 3px #61a7771a}.account-grid,.goal-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:13px}.account-card{background:linear-gradient(135deg,#1b6045,#287d57);color:white;border:0;min-height:145px;position:relative;overflow:hidden}.account-card:after{content:'';position:absolute;right:-35px;top:-52px;width:150px;height:150px;border-radius:50%;border:1px solid #ffffff1e;box-shadow:0 0 0 24px #ffffff08,0 0 0 48px #ffffff06}.account-card .stat-head{color:#d5eddd}.account-card .stat-icon{background:#ffffff19;color:white}.account-card .stat-value{position:relative;z-index:1}.account-card .stat-foot{color:#d2e5d8}.account-actions{display:flex;gap:6px;margin-top:12px;position:relative;z-index:2}.account-actions button{border:1px solid #ffffff38;background:#ffffff12;color:white;padding:6px 8px;border-radius:8px;font-size:9px}.budget-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.budget-card{box-shadow:none}.budget-row{display:flex;justify-content:space-between;align-items:center;gap:8px}.budget-row strong{font-size:11px}.budget-row small{display:block;color:var(--muted);font-size:9px;margin-top:4px}.budget-limit{font-weight:700;font-size:11px;text-align:right}.goal-card{box-shadow:none}.goal-top{display:flex;justify-content:space-between;align-items:flex-start}.goal-icon{width:37px;height:37px;border-radius:12px;background:var(--mint);color:var(--green);display:grid;place-items:center}.goal-progress{margin:14px 0 7px}.goal-foot{display:flex;justify-content:space-between;font-size:9px;color:var(--muted)}.report-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.report-rows{display:grid;gap:0}.report-row{padding:10px 0;border-bottom:1px solid #eef1ee;display:flex;justify-content:space-between;font-size:10px}.report-row:last-child{border:0}.settings-grid{display:grid;grid-template-columns:1.2fr .8fr;gap:15px}.dialog{border:0;border-radius:17px;padding:0;width:min(490px,calc(100% - 26px));box-shadow:0 25px 80px #10231944}.dialog::backdrop{background:#11261b70;backdrop-filter:blur(3px)}.dialog-head{padding:17px 19px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}.dialog-head h2{font:700 15px Manrope;margin:0}.close{border:0;background:#f2f5f2;width:29px;height:29px;border-radius:9px}.form{padding:17px 19px 19px}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:11px}.field{display:grid;gap:5px}.field.full{grid-column:1/-1}.field label{font-size:10px;color:#66736a;font-weight:700}.field input,.field select,.field textarea{width:100%}.field textarea{min-height:68px;resize:vertical}.form-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:17px}.toast{position:fixed;right:22px;bottom:22px;background:#163b29;color:white;padding:12px 16px;border-radius:11px;font-size:11px;box-shadow:0 9px 30px #132a1e33;z-index:30;animation:fade .2s}@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}.donut{width:150px;height:150px;margin:auto;position:relative}.donut canvas{width:100%;height:100%}.donut-center{position:absolute;inset:0;display:grid;align-content:center;text-align:center;pointer-events:none}.donut-center strong{font:800 15px Manrope}.donut-center small{font-size:9px;color:var(--muted)}.inline-buttons{display:flex;gap:7px}.tiny-action{border:0;background:transparent;color:#718076;padding:5px}.tiny-action:hover{color:var(--green)}.danger-zone{border:1px solid #f1dcdc;background:#fffafa}.footer-note{font-size:9px;color:#879188;line-height:1.5;margin-top:12px}
@media(max-width:1050px){.layout{grid-template-columns:215px 1fr}.content{padding:22px}.cards{grid-template-columns:repeat(2,1fr)}.account-grid,.goal-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:720px){.layout{display:block;padding-bottom:68px}.side{position:fixed;top:auto;bottom:0;width:100%;height:64px;padding:5px 6px;border-right:0;border-top:1px solid var(--line);display:block}.logo,.nav-label,.side-bottom{display:none}.nav{height:100%;display:flex;justify-content:space-around;gap:0}.nav button{flex:1;height:54px;padding:5px 1px;display:flex;flex-direction:column;justify-content:center;gap:4px;font-size:8px;border-radius:9px}.nav button i{font-size:15px}.content{padding:18px 13px 35px}.top{align-items:flex-start;margin-bottom:18px}.heading h1{font-size:21px}.heading p{font-size:10px}.top-actions{flex-direction:column;gap:5px}.top-actions .btn{padding:8px;font-size:9px}.cards{gap:8px}.card{padding:13px;border-radius:13px}.stat-value{font-size:17px}.grid2,.report-grid,.settings-grid{grid-template-columns:1fr}.account-grid,.goal-grid,.budget-grid{grid-template-columns:1fr 1fr;gap:8px}.table td{padding:9px 7px}.section-head h2{font-size:13px}.account-card{min-height:135px}.month-control{max-width:135px}.toast{right:12px;bottom:76px}}
@media(max-width:390px){.account-grid,.goal-grid,.budget-grid{grid-template-columns:1fr}.form-grid{grid-template-columns:1fr}.field.full{grid-column:auto}.top-actions .btn span{display:none}}

.cloud-status{display:flex;align-items:center;gap:8px;padding:9px 10px;border-radius:10px;background:#f3f7f3;color:#59675d;font-size:10px;margin:10px 0}.cloud-status i{color:var(--green)}.cloud-config{display:grid;grid-template-columns:1fr;gap:10px;margin-top:13px}.cloud-buttons{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}.cloud-help{color:#78847b;font-size:9px;line-height:1.55;margin-top:10px}.wide{grid-column:1/-1}.auth-email{font-size:10px;color:var(--green);font-weight:700}.hidden{display:none!important}

<body>
<div class="layout">
<aside class="side"><div class="logo"><div class="logo-icon"><i class="fa-solid fa-leaf"></i></div><div><strong>clara</strong><small>finanças com clareza</small></div></div><div class="nav-label">Visão geral</div><nav class="nav"><button class="active" data-page="dashboard"><i class="fa-solid fa-chart-pie"></i>Início</button><button data-page="transactions"><i class="fa-solid fa-arrow-right-arrow-left"></i>Lançamentos</button><button data-page="accounts"><i class="fa-solid fa-wallet"></i>Contas</button><button data-page="budgets"><i class="fa-solid fa-bullseye"></i>Orçamentos</button><button data-page="goals"><i class="fa-solid fa-flag-checkered"></i>Metas</button><button data-page="reports"><i class="fa-solid fa-chart-column"></i>Relatórios</button><button data-page="settings"><i class="fa-solid fa-gear"></i>Dados e ajustes</button></nav><div class="side-bottom"><div class="local-note"><i class="fa-solid fa-shield-halved"></i>Seus dados ficam neste navegador. Faça backups em Dados e ajustes.</div></div></aside>
<main class="content"><header class="top"><div class="heading"><h1 id="pageTitle">Visão geral</h1><p id="pageSubtitle">Uma visão tranquila e clara do seu dinheiro.</p></div><div class="top-actions"><input class="month-control" id="globalMonth" type="month"><button class="btn" data-page="settings"><i class="fa-solid fa-cloud-arrow-up"></i><span>Sincronização</span></button><button class="btn btn-primary" id="newTx"><i class="fa-solid fa-plus"></i><span>Novo lançamento</span></button></div></header><div id="page"></div></main>
</div>
<dialog class="dialog" id="dialog"><div class="dialog-head"><h2 id="dialogTitle">Novo lançamento</h2><button class="close" type="button" data-close><i class="fa-solid fa-xmark"></i></button></div><form id="dialogForm" class="form"></form></dialog>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(()=>{'use strict';
const DB_NAME='ClaraFinancasDB',DB_VERSION=1;let db, state={page:'dashboard',month:new Date().toISOString().slice(0,7),txFilter:'all',query:'',editingTx:null};
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)], today=()=>new Date().toISOString().slice(0,10), uid=()=>crypto.randomUUID?crypto.randomUUID():Date.now().toString(36)+Math.random().toString(36).slice(2), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=n=>new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'}).format(Number(n)||0), dateFmt=s=>s?new Intl.DateTimeFormat('pt-BR',{day:'2-digit',month:'short',year:'numeric'}).format(new Date(s+'T12:00:00')):'—', monthLabel=m=>m?new Intl.DateTimeFormat('pt-BR',{month:'long',year:'numeric'}).format(new Date(m+'-02')):'';
const categories={income:['Salário','Freelance','Investimentos','Vendas','Presente','Outras receitas'],expense:['Moradia','Alimentação','Transporte','Saúde','Educação','Lazer','Compras','Contas','Assinaturas','Viagem','Impostos','Outras despesas']};
const pageInfo={dashboard:['Visão geral','Uma visão tranquila e clara do seu dinheiro.'],transactions:['Lançamentos','Acompanhe cada entrada, saída e transferência.'],accounts:['Contas','Organize suas contas e acompanhe os saldos.'],budgets:['Orçamentos','Defina limites mensais por categoria.'],goals:['Metas','Transforme planos em objetivos possíveis.'],reports:['Relatórios','Entenda para onde seu dinheiro está indo.'],settings:['Dados e ajustes','Gerencie a segurança e os dados do seu aplicativo.']};
const req=(r)=>new Promise((res,rej)=>{r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});
function openDB(){return new Promise((res,rej)=>{const r=indexedDB.open(DB_NAME,DB_VERSION);r.onupgradeneeded=()=>{const d=r.result;for(const [name,key] of [['accounts','id'],['transactions','id'],['budgets','id'],['goals','id']])if(!d.objectStoreNames.contains(name))d.createObjectStore(name,{keyPath:key})};r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
function all(store){return req(db.transaction(store,'readonly').objectStore(store).getAll())}async function put(store,val){const out=await req(db.transaction(store,'readwrite').objectStore(store).put(val));scheduleCloudPush();return out}async function del(store,id){const out=await req(db.transaction(store,'readwrite').objectStore(store).delete(id));scheduleCloudPush();return out}
async function load(){const [accounts,transactions,budgets,goals]=await Promise.all(['accounts','transactions','budgets','goals'].map(all));return{accounts,transactions,budgets,goals}}
async function seed(){const a=await all('accounts');if(!a.length)await put('accounts',{id:uid(),name:'Conta principal',type:'Conta corrente',institution:'',openingBalance:0,createdAt:today()})}
function accountName(id){return cache.accounts.find(a=>a.id===id)?.name||'Conta removida'}
let cache={accounts:[],transactions:[],budgets:[],goals:[]};
let cloudConfig=null,cloudClient=null,cloudUser=null,cloudReady=false,cloudBusy=false,cloudApplying=false,cloudUpdatedAt='',cloudTimer=null,pollTimer=null;
function balance(a){let n=Number(a.openingBalance)||0;cache.transactions.forEach(t=>{if(t.type==='income'&&t.accountId===a.id)n+=Number(t.amount);if(t.type==='expense'&&t.accountId===a.id)n-=Number(t.amount);if(t.type==='transfer'){if(t.accountId===a.id)n-=Number(t.amount);if(t.toAccountId===a.id)n+=Number(t.amount)}});return n}
function totals(month=state.month){let income=0,expense=0;cache.transactions.filter(t=>t.date?.startsWith(month)).forEach(t=>{if(t.type==='income')income+=+t.amount;if(t.type==='expense')expense+=+t.amount});return{income,expense,net:income-expense,assets:cache.accounts.reduce((s,a)=>s+balance(a),0)}}
function expensesByCategory(month=state.month){const o={};cache.transactions.filter(t=>t.type==='expense'&&t.date?.startsWith(month)).forEach(t=>o[t.category]=(o[t.category]||0)+Number(t.amount));return o}
function allByMonth(){return cache.transactions.filter(t=>t.date?.startsWith(state.month)).sort((a,b)=>b.date.localeCompare(a.date))}
async function refresh(){cache=await load();render()}
function render(){const [title,sub]=pageInfo[state.page];$('#pageTitle').textContent=title;$('#pageSubtitle').textContent=sub;$('#globalMonth').value=state.month;$$('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===state.page));const host=$('#page');host.innerHTML='';({dashboard:renderDashboard,transactions:renderTransactions,accounts:renderAccounts,budgets:renderBudgets,goals:renderGoals,reports:renderReports,settings:renderSettings}[state.page]||renderDashboard)(host);if(state.page==='dashboard')drawDashboardCharts()}
function stat(label,value,foot,icon,cls=''){return `<div class="card"><div class="stat-head"><span>${label}</span><span class="stat-icon"><i class="fa-solid ${icon}"></i></span></div><div class="stat-value ${cls}">${value}</div><div class="stat-foot">${foot}</div></div>`}
function renderDashboard(h){const t=totals();const tx=allByMonth().slice(0,6);const spend=expensesByCategory();const top=Object.entries(spend).sort((a,b)=>b[1]-a[1]).slice(0,5);h.innerHTML=`<div class="cards">${stat('Saldo total',money(t.assets),'Saldo somado de todas as contas','fa-wallet')}${stat('Receitas do mês',money(t.income),'Entradas em '+esc(monthLabel(state.month)),'fa-arrow-trend-up','positive')}${stat('Despesas do mês',money(t.expense),'Saídas em '+esc(monthLabel(state.month)),'fa-arrow-trend-down','negative')}${stat('Resultado do mês',money(t.net),t.net>=0?'Saldo positivo no período':'Despesas acima das receitas','fa-scale-balanced',t.net>=0?'positive':'negative')}</div><div class="grid2"><section class="card"><div class="card-title"><div><h2>Movimento do mês</h2><p>Entradas e saídas registradas</p></div><div class="legend"><span><i></i>Receitas</span><span><i class="out"></i>Despesas</span></div></div><div class="chart"><canvas id="flowChart"></canvas></div></section><section class="card"><div class="card-title"><div><h2>Despesas por categoria</h2><p>Distribuição deste mês</p></div></div>${top.length?`<div class="category-list">${top.map(([c,v])=>`<div class="cat-line"><div class="cat-title"><strong>${esc(c)}</strong><span class="cat-amount">${money(v)}</span></div><div class="progress"><span style="width:${Math.max(4,Math.min(100,v/(Math.max(...top.map(x=>x[1])))*100))}%"></span></div></div>`).join('')}</div>`:`<div class="empty"><i class="fa-solid fa-chart-pie"></i>Sem despesas registradas neste mês.</div>`}</section></div><section class="card recent"><div class="section-head"><h2>Movimentações recentes</h2><button class="btn btn-small" data-go="transactions">Ver todas <i class="fa-solid fa-arrow-right"></i></button></div>${tx.length?txTable(tx,false):`<div class="empty"><i class="fa-solid fa-receipt"></i>Nenhum lançamento por aqui ainda.<br><button class="btn btn-primary btn-small" style="margin-top:12px" data-newtx>Adicionar primeiro lançamento</button></div>`}</section>`}
function txTable(arr,actions=true){return `<div class="table-wrap"><table class="table"><thead><tr><th>Descrição</th><th>Categoria</th><th>Conta</th><th>Data</th><th>Valor</th>${actions?'<th></th>':''}</tr></thead><tbody>${arr.map(t=>{const sign=t.type==='income'?'+':t.type==='expense'?'−':'↔';const cls=t.type==='income'?'positive':t.type==='expense'?'negative':'';const cat=t.type==='transfer'?'Transferência':t.category;return `<tr><td><div class="tx-title">${esc(t.description||cat)}</div><div class="tx-sub">${t.type==='transfer'?esc(accountName(t.accountId)+' → '+accountName(t.toAccountId)):esc(t.note||'')}</div></td><td><span class="pill">${esc(cat)}</span></td><td>${esc(accountName(t.accountId))}</td><td>${dateFmt(t.date)}</td><td class="amount ${cls}">${sign} ${money(t.amount)}</td>${actions?`<td><div class="inline-buttons"><button class="tiny-action" title="Editar" data-edit-tx="${esc(t.id)}"><i class="fa-solid fa-pen"></i></button><button class="tiny-action" title="Excluir" data-del-tx="${esc(t.id)}"><i class="fa-solid fa-trash"></i></button></div></td>`:''}</tr>`}).join('')}</tbody></table></div>`}

function canvasCtx(canvas){if(!canvas)return null;const dpr=window.devicePixelRatio||1,rect=canvas.getBoundingClientRect();if(!rect.width||!rect.height)return null;canvas.width=rect.width*dpr;canvas.height=rect.height*dpr;const c=canvas.getContext('2d');c.scale(dpr,dpr);return{c,w:rect.width,h:rect.height}}

function contribute(id){const g=cache.goals.find(x=>x.id===id);if(!g)return;openDialog('Adicionar à meta',`<div class="notice">${esc(g.name)} · já guardado ${money(g.saved)} de ${money(g.target)}</div><div class="field"><label>Valor a acrescentar (R$)</label><input type="number" name="value" min="0.01" step="0.01" required placeholder="0,00"></div><div class="form-actions"><button type="button" class="btn" data-close>Cancelar</button><button class="btn btn-primary">Atualizar progresso</button></div>`,async d=>{if(+d.value<=0)throw Error('Informe um valor maior que zero.');await put('goals',{...g,saved:+g.saved + +d.value});toast('Progresso atualizado.')})}
async function deleteTx(id){if(!confirm('Excluir este lançamento? O saldo da conta será recalculado.'))return;await del('transactions',id);await refresh();toast('Lançamento excluído.')}
async function deleteAccount(id){const a=cache.accounts.find(x=>x.id===id);if(cache.transactions.some(t=>t.accountId===id||t.toAccountId===id)){toast('Esta conta tem lançamentos. Remova-os ou transfira antes de excluí-la.');return}if(!confirm(`Excluir a conta “${a.name}”?`))return;await del('accounts',id);await refresh();toast('Conta excluída.')}
async function exportBackup(){const payload={app:'Clara',version:1,exportedAt:new Date().toISOString(),...cache};download('clara-backup-'+today()+'.json',JSON.stringify(payload,null,2),'application/json')}
function download(name,text,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function exportCSV(){const rows=[['data','tipo','descricao','categoria','conta','conta_destino','valor','observacao'],...allByMonth().map(t=>[t.date,t.type,t.description,t.category,accountName(t.accountId),t.toAccountId?accountName(t.toAccountId):'',t.amount,t.note])];download('lancamentos-'+state.month+'.csv','\ufeff'+rows.map(r=>r.map(v=>'"'+String(v??'').replaceAll('"','""')+'"').join(';')).join('\r\n'),'text/csv;charset=utf-8')}
async function restoreFile(file){try{const d=JSON.parse(await file.text());if(!d||!Array.isArray(d.accounts)||!Array.isArray(d.transactions)||!Array.isArray(d.budgets)||!Array.isArray(d.goals))throw Error();if(!confirm('Restaurar este backup vai substituir todos os dados atuais. Continuar?'))return;for(const s of ['accounts','transactions','budgets','goals'])await req(db.transaction(s,'readwrite').objectStore(s).clear());for(const [s,k] of [['accounts','accounts'],['transactions','transactions'],['budgets','budgets'],['goals','goals']])for(const row of d[k])await put(s,row);await refresh();toast('Backup restaurado.')}catch(e){toast('Arquivo inválido ou incompatível.')};$('#restoreFile').value=''}
async function clearData(){if(!confirm('Apagar definitivamente todos os dados deste navegador?'))return;if(!confirm('Confirmação final: essa ação não pode ser desfeita.'))return;for(const s of ['accounts','transactions','budgets','goals'])await req(db.transaction(s,'readwrite').objectStore(s).clear());await seed();await refresh();toast('Dados apagados.')}
function bindGlobal(){document.addEventListener('click',e=>{const n=e.target.closest('[data-page]');if(n){state.page=n.dataset.page;render();return}const g=e.target.closest('[data-go]');if(g){state.page=g.dataset.go;render();return}if(e.target.closest('[data-newtx]')||e.target.closest('#newTx')){txDialog();return}const edit=e.target.closest('[data-edit-tx]');if(edit){txDialog(edit.dataset.editTx);return}const delb=e.target.closest('[data-del-tx]');if(delb){deleteTx(delb.dataset.delTx);return}if(e.target.closest('[data-add-account]')){accountDialog();return}const ea=e.target.closest('[data-edit-account]');if(ea){accountDialog(ea.dataset.editAccount);return}const da=e.target.closest('[data-del-account]');if(da){deleteAccount(da.dataset.delAccount);return}if(e.target.closest('[data-add-budget]')){budgetDialog();return}const dbb=e.target.closest('[data-del-budget]');if(dbb){del('budgets',dbb.dataset.delBudget).then(refresh);return}if(e.target.closest('[data-add-goal]')){goalDialog();return}const eg=e.target.closest('[data-edit-goal]');if(eg){goalDialog(eg.dataset.editGoal);return}const dg=e.target.closest('[data-del-goal]');if(dg){if(confirm('Excluir esta meta?'))del('goals',dg.dataset.delGoal).then(refresh);return}const cg=e.target.closest('[data-contribute]');if(cg){contribute(cg.dataset.contribute);return}});
 $('#globalMonth').onchange=e=>{state.month=e.target.value||today().slice(0,7);render()};$('#backupBtn').onclick=exportBackup;$('#restoreBtn').onclick=()=>$('#restoreFile').click();$('#restoreFile').onchange=e=>e.target.files[0]&&restoreFile(e.target.files[0]);$('#clearData').onclick=clearData;$('#exportCsv')?.addEventListener('click',exportCSV);document.addEventListener('click',e=>{if(e.target.closest('#exportCsv'))exportCSV()});document.addEventListener('click',e=>{if(e.target.closest('[data-cloud-save]'))saveCloudConfig();if(e.target.closest('[data-cloud-login]'))authCloud('login');if(e.target.closest('[data-cloud-signup]'))authCloud('signup');if(e.target.closest('[data-cloud-download]'))downloadCloud(true);if(e.target.closest('[data-cloud-upload]'))uploadCloud(true);if(e.target.closest('[data-cloud-logout]'))logoutCloud()});window.addEventListener('resize',()=>{if(state.page==='dashboard')drawDashboardCharts();if(state.page==='reports')drawYearChart()})}
async function initCloud(){try{cloudConfig=JSON.parse(localStorage.getItem('clara-supabase-config')||'null');if(!cloudConfig?.url||!cloudConfig?.key||!window.supabase?.createClient)return;cloudClient=window.supabase.createClient(cloudConfig.url,cloudConfig.key,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});const {data,error}=await cloudClient.auth.getSession();if(error)throw error;if(data.session){cloudUser=data.session.user;await prepareCloudSession()}if(state.page==='settings')render()}catch(e){console.warn('Cloud init failed',e)}}
function scheduleCloudPush(){if(!cloudUser||!cloudReady||cloudApplying)return;clearTimeout(cloudTimer);cloudTimer=setTimeout(()=>pushCloud(false),1100)}
async function saveCloudConfig(){const url=$('#cloudUrl')?.value.trim().replace(/\/$/,'');const key=$('#cloudKey')?.value.trim();if(!url||!/^https:\/\//i.test(url)||!key){toast('Informe a URL HTTPS e a chave pública anon do Supabase.');return}try{localStorage.setItem('clara-supabase-config',JSON.stringify({url,key}));cloudConfig={url,key};cloudClient=window.supabase.createClient(url,key,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});const {data,error}=await cloudClient.auth.getSession();if(error)throw error;cloudUser=data.session?.user||null;if(cloudUser)await prepareCloudSession();render();toast('Conexão com Supabase salva neste dispositivo.')}catch(e){toast('Não foi possível conectar. Confira a URL e a chave pública.');console.error(e)}}
async function authCloud(mode){if(!cloudClient){toast('Salve primeiro as configurações do Supabase.');return}const email=$('#cloudEmail')?.value.trim(),password=$('#cloudPassword')?.value;if(!email||!password){toast('Informe seu e-mail e senha.');return}try{const result=mode==='login'?await cloudClient.auth.signInWithPassword({email,password}):await cloudClient.auth.signUp({email,password});if(result.error)throw result.error;if(result.data.session){cloudUser=result.data.session.user;await prepareCloudSession();render();toast(mode==='login'?'Login realizado.':'Conta criada e conectada.')}else{render();toast('Conta criada. Confirme seu e-mail e depois entre.')}}catch(e){toast(e.message||'Não foi possível autenticar.');console.error(e)}}
async function prepareCloudSession(){if(!cloudUser)return;try{const row=await getCloudRow();if(!row){cloudReady=true;const ok=await pushCloud(true);if(!ok){cloudReady=false;return}startCloudPolling();return}cloudUpdatedAt=row.updated_at||'';if(!hasLocalData()){await applyCloudData(row.data,row.updated_at);toast('Dados da nuvem carregados neste dispositivo.')}else{cloudReady=false;toast('Conta conectada. Escolha baixar os dados da nuvem ou enviar os dados locais.')}if(cloudReady)startCloudPolling()}catch(e){cloudReady=false;toast('Login feito, mas não foi possível acessar o banco. Confira o SQL e as políticas RLS.');console.error(e)}}
function hasLocalData(){return cache.transactions.length>0||cache.budgets.length>0||cache.goals.length>0||cache.accounts.length>1||cache.accounts.some(a=>Number(a.openingBalance)!==0)}
async function getCloudRow(){const {data,error}=await cloudClient.from('clara_data').select('data,updated_at').eq('user_id',cloudUser.id).maybeSingle();if(error)throw error;return data}
async function applyCloudData(data,updatedAt){if(!data||!Array.isArray(data.accounts)||!Array.isArray(data.transactions)||!Array.isArray(data.budgets)||!Array.isArray(data.goals))throw Error('Cloud data invalid');cloudApplying=true;try{for(const name of ['accounts','transactions','budgets','goals'])await req(db.transaction(name,'readwrite').objectStore(name).clear());for(const [store,key] of [['accounts','accounts'],['transactions','transactions'],['budgets','budgets'],['goals','goals']])for(const item of data[key])await req(db.transaction(store,'readwrite').objectStore(store).put(item));cache=await load();cloudUpdatedAt=updatedAt||'';cloudReady=true;render()}finally{cloudApplying=false}startCloudPolling()}
async function pushCloud(force){if(!cloudUser||(!cloudReady&&!force)||cloudBusy)return false;cloudBusy=true;try{const snapshot=await load();const {data,error}=await cloudClient.from('clara_data').upsert({user_id:cloudUser.id,data:snapshot,updated_at:new Date().toISOString()},{onConflict:'user_id'}).select('updated_at').single();if(error)throw error;cloudUpdatedAt=data?.updated_at||new Date().toISOString();cloudReady=true;if(state.page==='settings')render();return true}catch(e){toast('Falha ao sincronizar. Verifique sua conexão e as políticas do banco.');console.error(e);return false}finally{cloudBusy=false}}
async function downloadCloud(ask){if(!cloudClient||!cloudUser)return;try{const row=await getCloudRow();if(!row){if(confirm('Ainda não há dados na nuvem. Enviar os dados deste dispositivo para iniciar?'))await uploadCloud(false);return}if(ask&&!confirm('Os dados locais serão substituídos pelos dados da nuvem. Quer continuar?'))return;await applyCloudData(row.data,row.updated_at);toast('Dados baixados da nuvem.');render()}catch(e){toast('Não foi possível baixar. Verifique o banco e a conexão.');console.error(e)}}
async function uploadCloud(ask){if(!cloudUser)return;if(ask&&!confirm('Os dados atuais da nuvem serão substituídos pelos dados deste dispositivo. Quer continuar?'))return;cloudReady=true;const ok=await pushCloud(true);if(ok){startCloudPolling();toast('Dados enviados para a nuvem.')}else cloudReady=false}
async function logoutCloud(){if(!cloudClient)return;try{await cloudClient.auth.signOut();cloudUser=null;cloudReady=false;clearInterval(pollTimer);render();toast('Você saiu da conta. Os dados locais permanecem neste dispositivo.')}catch(e){toast('Não foi possível sair da conta.')}}
function startCloudPolling(){clearInterval(pollTimer);if(!cloudUser||!cloudReady)return;pollTimer=setInterval(async()=>{if(document.hidden||cloudBusy||!cloudReady)return;try{const row=await getCloudRow();if(row?.updated_at&&row.updated_at>cloudUpdatedAt)await applyCloudData(row.data,row.updated_at)}catch(e){console.warn('Cloud refresh unavailable',e)}},20000)}
let toastTimer;function toast(s){let el=$('.toast');if(!el){el=document.createElement('div');el.className='toast';document.body.appendChild(el)}el.textContent=s;clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.remove(),2800)}
(async()=>{try{if(!('indexedDB'in window))throw Error();db=await openDB();await seed();await refresh();bindGlobal();await initCloud()}catch(e){document.querySelector('.content').innerHTML='<section class="card"><h2>Não foi possível abrir o banco local</h2><p>Confira se o navegador permite armazenamento local e tente abrir novamente.</p></section>';console.error(e)}})();
})();
</script>
</body></html>
